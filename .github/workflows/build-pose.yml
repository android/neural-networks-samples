# Workflow name
name: Build NeuralNetworksSamplesPoseEstimationApp

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set Up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11' # Defaulting as not specified, matches example
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: ./PoseEstimation

      - name: Build NeuralNetworksSamplesPoseEstimationApp app
        working-directory: ./PoseEstimation
        run: ./gradlew :app:assembleDebug
